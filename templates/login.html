<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk Akun | KAMISTORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  </head>
  <body class="min-h-screen flex items-center justify-center p-4 sm:p-8">
    <main class="w-full max-w-6xl bg-white rounded-[2rem] shadow-xl px-6 py-10 sm:px-10 lg:px-16 lg:py-16 grid lg:grid-cols-2 gap-10 lg:gap-16 items-center">
      <!-- ===== Kiri: branding ===== -->
      <section class="flex flex-col items-center text-center">
        <a href="{{ url_for('shop.home') }}" aria-label="KAMISTORE - Beranda">
          <img alt="KAMISTORE" class="h-36 sm:h-48 lg:h-80 w-auto object-contain" src="{{ url_for('static', filename='images/logo2.png') }}" />
        </a>

      </section>

      <!-- ===== Kanan: form ===== -->
      <section class="w-full max-w-md mx-auto lg:max-w-7xl">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-center text-slate-900">Masuk Akun <span class="text-red-600">KAMI</span><span class="text-blue-700">STORE</span></h1>

        <form id="login-form" method="post" action="{{ url_for('auth.login') }}" class="mt-8 flex flex-col">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="hidden" name="next" value="{{ next or '' }}">
          {% for msg in get_flashed_messages() %}
          <div class="mb-4 rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">{{ msg }}</div>
          {% endfor %}
          {% if error %}
          <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error }}</div>
          {% endif %}
          <!-- Email -->
          <div class="relative">
            <input
              id="email"
              name="email" value="{{ email or '' }}"
              type="email"
              required
              autocomplete="email"
              placeholder=" "
              class="peer h-14 w-full rounded-xl border border-slate-300 px-4 pt-5 pb-1 text-sm text-slate-900 placeholder-transparent focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100 transition"
            />
            <label
              for="email"
              class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500 transition-all peer-focus:top-3.5 peer-focus:text-[11px] peer-[:not(:placeholder-shown)]:top-3.5 peer-[:not(:placeholder-shown)]:text-[11px]"
              >Email</label
            >
          </div>

          <!-- Kata sandi -->
          <div class="relative mt-4">
            <input
              id="password"
              name="password"
              type="password"
              required
              autocomplete="current-password"
              placeholder=" "
              class="peer h-14 w-full rounded-xl border border-slate-300 pl-4 pr-12 pt-5 pb-1 text-sm text-slate-900 placeholder-transparent focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100 transition"
            />
            <label
              for="password"
              class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500 transition-all peer-focus:top-3.5 peer-focus:text-[11px] peer-[:not(:placeholder-shown)]:top-3.5 peer-[:not(:placeholder-shown)]:text-[11px]"
              >Kata Sandi</label
            >
            <button type="button" id="toggle-password" aria-label="Tampilkan kata sandi" class="absolute right-3 top-1/2 -translate-y-1/2 hidden items-center justify-center h-9 w-9 rounded-lg text-slate-700 hover:text-slate-900">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>

          <a href="{{ url_for('lupa.request_reset') }}" class="self-end mt-3 text-xs font-medium text-slate-900 underline hover:text-red-600">Lupa Kata Sandi</a>

          <button id="submit-btn" type="submit" disabled class="mt-6 h-12 rounded-xl bg-slate-200 text-white text-sm font-bold transition-colors enabled:bg-red-600 enabled:hover:bg-red-700 disabled:cursor-not-allowed">Masuk</button>
        </form>
        <p class="mt-8 text-center text-sm text-slate-900">
          Belum punya akun?
          <a href="{{ url_for('auth.register') }}" class="font-semibold underline hover:text-red-600">Daftar</a>
        </p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
  </body>
</html>
