<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Akun | KAMISTORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/auth.css') }}"
    />
  </head>
  <body class="min-h-screen flex items-center justify-center p-4 sm:p-8">
    <main
      class="w-full max-w-6xl bg-white rounded-[2rem] shadow-xl px-6 py-10 sm:px-10 lg:px-16 lg:py-14 grid lg:grid-cols-2 gap-10 lg:gap-16 items-center"
    >
      <!-- ===== Kiri: branding ===== -->
      <section class="flex flex-col items-center text-center">
        <a href="{{ url_for('shop.home') }}" aria-label="KAMISTORE - Beranda">
          <img
            alt="KAMISTORE"
            class="h-36 sm:h-48 lg:h-80 w-auto object-contain"
            src="{{ url_for('static', filename='images/logo2.png') }}"
          />
        </a>
      </section>

      <!-- ===== Kanan: form ===== -->
      <section class="w-full max-w-md mx-auto lg:max-w-none">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-center text-slate-900">
          Daftar Akun <span class="text-red-600">KAMI</span><span class="text-blue-700">STORE</span>
        </h1>

        <form
          id="register-form"
          method="post"
          action="{{ url_for('auth.register') }}"
          class="mt-8 flex flex-col gap-4"
          novalidate
        >
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          {% if error %}
          <div class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
            {{ error }}
          </div>
          {% endif %}

          <!-- Email -->
          <div class="relative">
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder=" "
              value="{{ form.get('email', '') if form else '' }}"
              class="peer h-14 w-full rounded-xl border border-slate-300 px-4 pt-5 pb-1 text-sm text-slate-900 placeholder-transparent focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100 transition"
            />
            <label
              for="email"
              class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500 transition-all peer-focus:top-3.5 peer-focus:text-[11px] peer-[:not(:placeholder-shown)]:top-3.5 peer-[:not(:placeholder-shown)]:text-[11px]"
              >Email</label
            >
          </div>

          <!-- Nama lengkap -->
          <div class="relative">
            <input
              id="nama"
              name="nama"
              type="text"
              required
              autocomplete="name"
              placeholder=" "
              value="{{ form.get('nama', '') if form else '' }}"
              class="peer h-14 w-full rounded-xl border border-slate-300 px-4 pt-5 pb-1 text-sm text-slate-900 placeholder-transparent focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100 transition"
            />
            <label
              for="nama"
              class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500 transition-all peer-focus:top-3.5 peer-focus:text-[11px] peer-[:not(:placeholder-shown)]:top-3.5 peer-[:not(:placeholder-shown)]:text-[11px]"
              >Nama Lengkap</label
            >
          </div>

          <!-- Kata sandi + konfirmasi -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                required
                autocomplete="new-password"
                placeholder=" "
                class="peer h-14 w-full rounded-xl border border-slate-300 pl-4 pr-12 pt-5 pb-1 text-sm text-slate-900 placeholder-transparent focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100 transition"
              />
              <label
                for="password"
                class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500 transition-all peer-focus:top-3.5 peer-focus:text-[11px] peer-[:not(:placeholder-shown)]:top-3.5 peer-[:not(:placeholder-shown)]:text-[11px]"
                >Kata Sandi</label
              >
              <button
                type="button"
                data-toggle="password"
                aria-label="Tampilkan kata sandi"
                class="absolute right-3 top-1/2 -translate-y-1/2 hidden items-center justify-center h-9 w-9 rounded-lg text-slate-700 hover:text-slate-900"
              >
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>

            <div class="relative">
              <input
                id="confirm"
                name="konfirmasi"
                type="password"
                required
                autocomplete="new-password"
                placeholder=" "
                class="peer h-14 w-full rounded-xl border border-slate-300 pl-4 pr-12 pt-5 pb-1 text-sm text-slate-900 placeholder-transparent focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100 transition"
              />
              <label
                for="confirm"
                class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500 transition-all peer-focus:top-3.5 peer-focus:text-[11px] peer-[:not(:placeholder-shown)]:top-3.5 peer-[:not(:placeholder-shown)]:text-[11px]"
                >Konfirmasi Kata Sandi</label
              >
              <button
                type="button"
                data-toggle="confirm"
                aria-label="Tampilkan konfirmasi kata sandi"
                class="absolute right-3 top-1/2 -translate-y-1/2 hidden items-center justify-center h-9 w-9 rounded-lg text-slate-700 hover:text-slate-900"
              >
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>

          <!-- Checklist aturan kata sandi -->
          <ul class="-mt-1 flex flex-col gap-1 text-sm">
            <li data-rule="len" class="flex items-center gap-2 text-slate-500">
              <span class="material-symbols-outlined text-base">check</span>
              Minimum 8 karakter
            </li>
            <li data-rule="mix" class="flex items-center gap-2 text-slate-500">
              <span class="material-symbols-outlined text-base">check</span>
              Sertakan huruf kapital, non-kapital, angka &amp; simbol.
            </li>
            <li id="match-msg" class="hidden items-center gap-2 text-red-600">
              <span class="material-symbols-outlined text-base">close</span>
              Konfirmasi kata sandi belum sama.
            </li>
          </ul>

          <!-- Kode referral -->
          <div class="relative">
            <input
              id="referral"
              name="referral"
              type="text"
              placeholder=" "
              value="{{ form.get('referral', '') if form else '' }}"
              class="peer h-14 w-full rounded-xl border border-slate-300 px-4 pt-5 pb-1 text-sm text-slate-900 placeholder-transparent focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-100 transition"
            />
            <label
              for="referral"
              class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-500 transition-all peer-focus:top-3.5 peer-focus:text-[11px] peer-[:not(:placeholder-shown)]:top-3.5 peer-[:not(:placeholder-shown)]:text-[11px]"
              >Kode Referral (opsional)</label
            >
          </div>

          <!-- Setuju syarat -->
          <label class="flex items-start gap-3 text-xs text-slate-900 cursor-pointer">
            <input
              id="agree"
              name="setuju"
              type="checkbox"
              class="mt-0.5 h-4 w-4 rounded border-slate-400 accent-red-600"
            />
            <span>
              Saya menyetujui
              <a href="#" class="underline hover:text-red-600">Syarat &amp; Ketentuan</a>
              dan
              <a href="#" class="underline hover:text-red-600">Kebijakan Privasi</a>
              <span class="font-semibold"><span class="text-red-600">KAMI</span><span class="text-blue-700">STORE</span></span>
          </label>

          <button
            id="submit-btn"
            type="submit"
            disabled
            class="h-12 rounded-xl bg-slate-200 text-white text-sm font-bold transition-colors enabled:bg-red-600 enabled:hover:bg-red-700 disabled:cursor-not-allowed"
          >
            Daftar
          </button>
        </form>

        <p class="mt-6 text-center text-sm text-slate-900">
          Sudah punya akun?
          <a href="{{ url_for('auth.login') }}" class="font-semibold underline hover:text-red-600">Masuk</a>
        </p>
      </section>
    </main>

    <script
      src="{{ url_for('static', filename='js/register.js') }}"
      defer
    ></script>
  </body>
</html>
