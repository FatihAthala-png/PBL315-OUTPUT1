<!doctype html>
<html lang="id">
  <head>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}KAMISTORE{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </head>
  <body class="bg-surface font-body-md text-on-surface antialiased">
    {% include 'partials/header.html' %}
    <main class="w-full pt-[10.5rem] md:pt-32 bg-surface min-h-[calc(100vh-168px)] md:min-h-[calc(100vh-128px)]">
      {% block content %}{% endblock %}
    </main>
    {% include 'partials/footer.html' %}
  </body>
</html>
