<section class="max-w-7xl mx-auto px-6 lg:px-12 w-full pt-space-md pb-space-lg">
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- ===== Carousel utama (kiri) ===== -->
    <div id="hero-carousel" class="relative lg:col-span-2">
      <div class="overflow-hidden rounded-2xl shadow-lg aspect-[4/3] sm:aspect-[2/1] lg:aspect-auto lg:absolute lg:inset-0">
        <div data-track class="flex h-full transition-transform duration-300 ease-out">
          <a href="{{ url_for('shop.page', page='pokemon-tcg') }}" class="block w-full h-full shrink-0">
            <img alt="Promo 1" class="w-full h-full object-cover" src="{{ url_for('static', filename='images/iklan1.png') }}" />
          </a>
          <a href="{{ url_for('shop.page', page='pokemon-tcg') }}" class="block w-full h-full shrink-0">
            <img alt="Promo 2" class="w-full h-full object-cover" src="{{ url_for('static', filename='images/iklan2.png') }}" />
          </a>
          <a href="{{ url_for('shop.page', page='pokemon-tcg') }}" class="block w-full h-full shrink-0">
            <img alt="Promo 3" class="w-full h-full object-cover" src="{{ url_for('static', filename='images/iklan3.png') }}" />
          </a>
        </div>
      </div>

      <!-- Titik indikator -->
      <div class="absolute bottom-4 left-6 flex items-center gap-2">
        <button type="button" data-dot class="h-2 w-2 rounded-full bg-white" aria-label="Slide 1"></button>
        <button type="button" data-dot class="h-2 w-2 rounded-full bg-white opacity-40" aria-label="Slide 2"></button>
        <button type="button" data-dot class="h-2 w-2 rounded-full bg-white opacity-40" aria-label="Slide 3"></button>
      </div>

      <!-- Panah -->
      <button
        type="button"
        data-prev
        aria-label="Sebelumnya"
        class="absolute top-1/2 -translate-y-1/2 left-2 lg:-left-5 flex items-center justify-center h-11 w-11 rounded-full bg-white text-on-surface shadow-md hover:bg-surface-container-low transition-colors"
      >
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <button
        type="button"
        data-next
        aria-label="Berikutnya"
        class="absolute top-1/2 -translate-y-1/2 right-2 lg:-right-5 flex items-center justify-center h-11 w-11 rounded-full bg-white text-on-surface shadow-md hover:bg-surface-container-low transition-colors"
      >
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>

    <!-- ===== Dua banner (kanan) ===== -->
    <div class="grid grid-cols-2 lg:grid-cols-1 lg:grid-rows-2 gap-4">
      <a href="{{ url_for('shop.page', page='action-figures') }}" class="block overflow-hidden rounded-2xl aspect-[2/1]">
        <img alt="Banner samping 1" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" src="{{ url_for('static', filename='images/b1.png') }}" />
      </a>
      <a href="{{ url_for('shop.page', page='pokemon-tcg') }}" class="block overflow-hidden rounded-2xl aspect-[2/1]">
        <img alt="Banner samping 2" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" src="{{ url_for('static', filename='images/b2.png') }}" />
      </a>
    </div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/hero.js') }}" defer></script>
