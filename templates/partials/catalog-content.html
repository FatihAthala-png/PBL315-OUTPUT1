<section class="max-w-7xl mx-auto px-6 lg:px-12 w-full pb-12 md:pb-16">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    {% include 'partials/catalog-filters.html' %}

    <div class="lg:col-span-9 w-full flex flex-col gap-6 min-w-0">
      <div class="grid grid-cols-2 xl:grid-cols-3 gap-4" id="catalog-items-container">{% for product in products %} {% include 'partials/product-card.html' %} {% endfor %}</div>

      <!-- Tampil kalau tidak ada produk yang cocok -->
      <div id="empty-state" style="display: none" class="flex flex-col items-center gap-3 rounded-2xl border border-slate-200 bg-white py-16 text-center">
        <span class="material-symbols-outlined text-5xl text-slate-400">search_off</span>
        <p class="font-heading text-lg font-bold text-slate-900">Tidak ada produk yang cocok dengan filter kamu.</p>
        <button type="button" data-reset-filters class="rounded-lg border border-blue-600 px-5 py-2 text-sm font-bold text-blue-600 transition-colors hover:bg-blue-600 hover:text-white">Reset Filter</button>
      </div>

      <p class="text-sm text-slate-500">Menampilkan <span data-result-count>{{ products|length }}</span> dari {{ products|length }} total produk koleksi</p>
    </div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/filter.js') }}" defer></script>
