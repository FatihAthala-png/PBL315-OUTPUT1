<section class="max-w-7xl mx-auto px-6 lg:px-12 w-full pb-12 md:pb-16">
  <!-- Judul untuk layar kecil (panel kiri disembunyikan di layar kecil) -->
  <h2 class="font-heading sm:hidden mb-4 text-2xl font-extrabold text-[#0a4f9e]">Most Popular Items</h2>

  <div id="popular-items" class="relative flex items-stretch">
    <!-- ===== Panel kiri ===== -->
    <div class="relative z-0 hidden sm:block shrink-0 w-72 lg:w-80 -mr-10 rounded-3xl bg-[#fbc4ee] overflow-hidden">
      <svg class="absolute left-0 top-0 w-full" viewBox="0 0 320 200" preserveAspectRatio="xMinYMin slice" aria-hidden="true">
        <path d="M0 0 H190 V44 H150 V88 H108 V130 H58 V170 H0 Z" fill="#d6347f" />
        <path d="M12 78 C30 26 98 34 86 76 C78 102 40 92 56 72 L146 152" fill="none" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h2 class="font-heading absolute left-8 bottom-8 max-w-[12rem] text-4xl lg:text-5xl font-extrabold leading-[1.1] text-[#0a4f9e]">Most Popular Items</h2>
    </div>

    <!-- ===== Daftar kartu ===== -->
    <div class="relative z-10 min-w-0 flex-1 py-2.5">
      <button type="button" data-prev aria-label="Sebelumnya" class="absolute -left-5 top-1/2 z-20 -translate-y-1/2 flex h-10 w-10 items-center justify-center rounded-full bg-slate-300/90 text-white transition hover:bg-slate-400">
        <span class="material-symbols-outlined">chevron_left</span>
      </button>
      <button type="button" data-next aria-label="Berikutnya" class="absolute -right-5 top-1/2 z-20 -translate-y-1/2 flex h-10 w-10 items-center justify-center rounded-full bg-slate-300/90 text-white transition hover:bg-slate-400">
        <span class="material-symbols-outlined">chevron_right</span>
      </button>

      <div data-scroller class="flex gap-4 overflow-x-auto scroll-smooth snap-x snap-mandatory [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        {% for product in popular_products %}
        <article class="snap-start shrink-0 w-56 md:w-60 flex h-auto flex-col rounded-2xl border border-slate-200 bg-white p-4">
          <div class="relative">
            <button type="button" data-wish aria-pressed="false" aria-label="Tambah {{ product.name }} ke wishlist" class="absolute right-0 top-0 z-10 text-slate-500 hover:text-red-500 transition-colors">
              <span class="material-symbols-outlined">favorite</span>
            </button>
            <a href="{{ url_for('shop.product', product_id=product.id) }}" class="block">
              <img alt="{{ product.name }}" class="h-44 w-full rounded-xl object-cover" src="{{ product.image_url }}" />
            </a>
          </div>

          <p class="mt-4 truncate text-sm font-bold text-blue-600">{{ product.category }}</p>
          <h3 class="mt-1 min-h-[2.5rem] text-sm leading-5 text-slate-600 line-clamp-2"><a href="{{ url_for('shop.product', product_id=product.id) }}" class="hover:text-blue-600">{{ product.name }}</a></h3>

          <!-- Harga: didorong ke bawah supaya sejajar antar kartu -->
          <div class="mt-auto flex flex-col pt-2">
            <!-- Baris diskon selalu ada (tinggi tetap), kosong jika tidak ada diskon -->
            <div class="flex min-h-5 items-center gap-2">
              {% if product.discount %}
              <span class="text-xs text-slate-400 line-through">{{ product.old_price }}</span>
              <span class="rounded bg-red-500 px-1.5 py-0.5 text-[10px] font-bold text-white">{{ product.discount }}% OFF</span>
              {% endif %}
            </div>
            <p class="font-bold text-slate-900">{{ product.price }}</p>
          </div>

          <button type="button" data-cart data-product-id="{{ product.id }}" class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-sky-100 py-2.5 text-sm font-bold text-blue-700 transition-colors hover:bg-sky-200">
            <span class="material-symbols-outlined text-base">shopping_cart</span>
            Add to cart
          </button>
        </article>
        {% endfor %}
      </div>
    </div>
  </div>
</section>

<script src="{{ url_for('static', filename='js/popular.js') }}" defer></script>
