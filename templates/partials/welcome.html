<!-- Container sama dengan hero.html supaya tepi kiri-kanan sejajar dengan banner -->
<div class="mx-auto w-full max-w-7xl px-6 pb-space-lg lg:px-12">
  <div class="relative xl:mb-24">
    <section class="relative w-full overflow-hidden rounded-2xl bg-[#ffec99] shadow-lg xl:rounded-br-none">
      <!-- Hiasan kanan atas: lengkung merah -->
      <svg class="pointer-events-none absolute right-0 top-0 hidden w-44 md:block lg:w-56" viewBox="0 0 375 190" aria-hidden="true">
        <g fill="none" stroke="#ff2f45" stroke-width="48" stroke-linecap="butt" stroke-linejoin="round">
          <path d="M30 -20 L100 80 C135 120 215 122 265 88" />
          <path d="M240 -20 V28 C240 52 255 62 275 76 L400 168" />
        </g>
      </svg>

      <div class="relative grid w-full grid-cols-1 items-center gap-8 px-6 py-10 md:grid-cols-2 md:gap-12 md:py-14 lg:px-12">
        <!-- Foto + hiasan roda gigi -->
        <div class="relative w-full">
          <svg class="absolute -left-6 -top-6 z-0 h-20 w-20" viewBox="0 0 100 100" aria-hidden="true">
            <g fill="#f6ad1d">
              <circle cx="50" cy="50" r="34" />
              {% for i in range(12) %}
              <rect x="43" y="4" width="14" height="18" rx="3" transform="rotate({{ i * 30 }} 50 50)" />
              {% endfor %}
            </g>
          </svg>

          <a href="{{ url_for('shop.page', page='pokemon-tcg') }}" class="relative z-10 block aspect-[2/1] w-full overflow-hidden rounded-2xl shadow-lg">
            <img
              alt="Selamat datang di KAMISTORE"
              class="h-full w-full object-cover transition-transform duration-500 hover:scale-105"
              src="{{ url_for('static', filename='images/welcome.png') }}"
              onerror="this.onerror=null;this.src='{{ url_for('static', filename='images/welcome.png') }}'"
            />
          </a>
        </div>

        <!-- Teks -->
        <div class="max-w-xl text-center md:text-left">
          <h2 class="font-heading text-4xl font-extrabold leading-tight text-blue-700 md:text-5xl lg:text-5xl">
            Welcome to
            <span class="text-red-600">KAMI</span><span class="text-blue-700">STORE</span>!
          </h2>
          <p class="mt-4 text-base leading-7 text-slate-600 md:text-lg md:leading-8">
            KAMISTORE adalah toko kurasi Pokémon Trading Card Game dan action figure skala asli Jepang di Indonesia. Setiap produk dicek keasliannya dan dikirim dengan aman, jadi kamu bisa berburu koleksi impianmu dengan tenang. Selamat
            datang di KAMISTORE!
          </p>
          <a href="{{ url_for('shop.page', page='pokemon-tcg') }}" class="mt-6 inline-flex items-center rounded-xl bg-blue-600 px-7 py-3 text-base font-bold text-white transition-colors hover:bg-blue-700"> Jelajahi Sekarang </a>
        </div>
      </div>
    </section>

    <!-- Hiasan tangga: hijau menempel di pita kuning, pink menggantung di bawahnya -->
    <svg class="pointer-events-none absolute bottom-0 right-0 z-10 hidden w-24 translate-y-1/2 xl:block 2xl:w-28" viewBox="0 0 188 373" aria-hidden="true">
      <path d="M0 186 V140 H47 V93 H94 V47 H141 V0 H188 V186 Z" fill="#09b36b" />
      <path d="M0 186 V233 H47 V280 H94 V326 H141 V373 H188 V186 Z" fill="#ff8aa5" />
    </svg>
  </div>
</div>
